<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>你是哪个AI水果？</title>
  <style>
    :root {
      --ink: #201814;
      --paper: #fff8ea;
      --red: #d7382d;
      --green: #236d55;
      --yellow: #ffc845;
      --line: rgba(32, 24, 20, .18);
      --shadow: 0 24px 70px rgba(63, 35, 16, .25);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 9% 13%, rgba(255, 200, 69, .48), transparent 28%),
        radial-gradient(circle at 88% 17%, rgba(231, 75, 86, .34), transparent 30%),
        linear-gradient(135deg, #fff8ea 0%, #ffd36c 50%, #ff795a 100%);
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(32,24,20,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32,24,20,.08) 1px, transparent 1px);
      background-size: 32px 32px;
      mix-blend-mode: multiply;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    .app {
      width: min(1080px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
      position: relative;
    }

    .screen {
      display: none;
      min-height: calc(100vh - 48px);
      animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
    }

    .screen.active { display: grid; }

    .hero {
      min-height: calc(100vh - 48px);
      align-content: center;
      gap: 22px;
      position: relative;
    }

    .fruit-marquee {
      position: absolute;
      inset: 4% 0 auto;
      height: 180px;
      pointer-events: none;
      filter: drop-shadow(0 15px 18px rgba(32, 24, 20, .16));
    }

    .fruit {
      position: absolute;
      display: grid;
      place-items: center;
      width: clamp(58px, 10vw, 108px);
      aspect-ratio: 1;
      border: 2px solid rgba(32,24,20,.2);
      border-radius: 50%;
      background: rgba(255,255,255,.42);
      backdrop-filter: blur(5px);
      font-size: clamp(30px, 6vw, 58px);
      animation: float 5s ease-in-out infinite;
    }

    .fruit:nth-child(1) { left: 0; top: 62px; animation-delay: -.4s; }
    .fruit:nth-child(2) { left: 18%; top: 8px; animation-delay: -1.7s; }
    .fruit:nth-child(3) { left: 43%; top: 86px; animation-delay: -.9s; }
    .fruit:nth-child(4) { right: 18%; top: 18px; animation-delay: -2.3s; }
    .fruit:nth-child(5) { right: 0; top: 72px; animation-delay: -1.1s; }

    .eyebrow {
      width: fit-content;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.42);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .08em;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 {
      max-width: 840px;
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(54px, 11vw, 132px);
      line-height: .88;
      letter-spacing: 0;
    }

    .lede {
      max-width: 740px;
      margin: 0;
      font-size: clamp(17px, 2vw, 24px);
      line-height: 1.65;
      font-weight: 800;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .primary,
    .secondary {
      min-height: 52px;
      padding: 0 22px;
      border-radius: 8px;
      font-weight: 900;
      box-shadow: 0 12px 0 rgba(32,24,20,.18);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .primary {
      background: var(--ink);
      color: var(--paper);
    }

    .secondary {
      background: rgba(255,255,255,.5);
      border: 1px solid var(--line);
    }

    .primary:hover,
    .secondary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 0 rgba(32,24,20,.16);
    }

    .stage {
      align-content: center;
      gap: 22px;
    }

    .panel {
      width: min(780px, 100%);
      margin: auto;
      background: rgba(255, 248, 234, .86);
      border: 1px solid rgba(32, 24, 20, .18);
      box-shadow: var(--shadow);
      border-radius: 8px;
      overflow: hidden;
    }

    .question-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 18px;
      background: rgba(255,255,255,.5);
      border-bottom: 1px solid var(--line);
    }

    .progress {
      height: 8px;
      background: rgba(32, 24, 20, .12);
      border-radius: 99px;
      overflow: hidden;
      grid-column: 1 / -1;
    }

    .progress span {
      display: block;
      height: 100%;
      width: var(--p);
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
      border-radius: inherit;
      transition: width .35s ease;
    }

    .count {
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 900;
      white-space: nowrap;
    }

    .question {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(24px, 4.3vw, 42px);
      line-height: 1.16;
    }

    .options {
      display: grid;
      gap: 10px;
      padding: 18px;
    }

    .option {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 70px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,.6);
      border: 1px solid rgba(32,24,20,.14);
      text-align: left;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .option:hover {
      transform: translateX(5px);
      background: #fff;
      border-color: rgba(32,24,20,.34);
    }

    .option.selected {
      background: #fff7cf;
      border-color: rgba(32,24,20,.62);
      box-shadow: inset 0 0 0 2px rgba(255, 200, 69, .85);
      transform: translateX(5px);
    }

    .letter {
      display: grid;
      place-items: center;
      width: 40px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--yellow);
      border: 1px solid rgba(32,24,20,.2);
      font-weight: 900;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 0 18px 18px;
    }

    .arrow-btn {
      display: inline-grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 10px 0 rgba(32,24,20,.16);
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }

    .arrow-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 14px 0 rgba(32,24,20,.14);
    }

    .arrow-btn:disabled {
      opacity: .28;
      cursor: not-allowed;
      box-shadow: none;
    }

    .nav-hint {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 900;
      color: rgba(32,24,20,.68);
    }

    .result {
      align-content: center;
      gap: 18px;
    }

    .result-card {
      display: grid;
      grid-template-columns: minmax(280px, .78fr) 1fr;
      width: min(1040px, 100%);
      margin: auto;
      background: rgba(255, 248, 234, .88);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .portrait {
      min-height: 650px;
      padding: 24px;
      display: grid;
      align-content: end;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(32,24,20,.2)),
        var(--role-bg, #ffe36e);
      position: relative;
      overflow: hidden;
    }

    .portrait::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 2px solid rgba(255,248,234,.44);
      border-radius: 8px;
      z-index: 2;
      pointer-events: none;
    }

    .role-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(1.06) contrast(1.03);
      transform: scale(1.01);
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 48%, rgba(32,24,20,.66)),
        linear-gradient(90deg, rgba(32,24,20,.12), transparent 45%);
      z-index: 1;
      pointer-events: none;
    }

    .stamp {
      position: relative;
      z-index: 3;
      width: fit-content;
      max-width: 100%;
      padding: 10px 12px;
      background: rgba(255,248,234,.88);
      border: 2px solid rgba(32,24,20,.72);
      border-radius: 8px;
      font-weight: 900;
      transform: rotate(-3deg);
    }

    .result-main {
      padding: clamp(22px, 4vw, 40px);
      display: grid;
      gap: 20px;
    }

    .role-id {
      margin: 0;
      color: var(--green);
      font-size: 13px;
      letter-spacing: .09em;
      font-weight: 900;
    }

    .role-name {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(38px, 6vw, 70px);
      line-height: .95;
    }

    .tagline {
      margin: 0;
      font-size: clamp(18px, 2.4vw, 26px);
      line-height: 1.42;
      font-weight: 900;
    }

    .analysis {
      margin: 0;
      color: rgba(32,24,20,.78);
      line-height: 1.75;
      font-weight: 700;
    }

    .bars {
      display: grid;
      gap: 14px;
      padding-top: 6px;
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .track {
      height: 14px;
      border-radius: 999px;
      background: rgba(32,24,20,.12);
      overflow: hidden;
      border: 1px solid rgba(32,24,20,.12);
    }

    .fill {
      width: calc(var(--v) * 10%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
      transition: width .5s ease;
    }

    .quote {
      padding: 16px;
      border-radius: 8px;
      border: 1px dashed rgba(32,24,20,.38);
      background: rgba(255,255,255,.52);
      font-family: Georgia, "Songti SC", serif;
      font-size: 20px;
      line-height: 1.5;
      font-weight: 900;
    }

    .blacken {
      display: none;
      background: #16110f;
      color: #ffe36e;
    }

    .blacken.visible { display: inline-block; }

    .is-cracking .result-card {
      animation: crack .7s steps(2, end);
    }

    .is-cracking .result-card::before,
    .is-cracking .result-card::after {
      content: "";
      position: absolute;
      inset: -15%;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 48%, rgba(32,24,20,.8) 48.2% 49%, transparent 49.2%),
        linear-gradient(55deg, transparent 0 58%, rgba(32,24,20,.72) 58.2% 59%, transparent 59.2%);
      animation: flash .7s ease both;
      z-index: 5;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      gap: 10px;
      padding-top: 4px;
    }

    .mini {
      min-height: 168px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.45);
      font-size: 12px;
      font-weight: 900;
      display: grid;
      grid-template-rows: 86px auto auto;
      gap: 6px;
      overflow: hidden;
    }

    .mini img {
      width: 100%;
      height: 86px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(32,24,20,.12);
    }

    .mini small {
      color: rgba(32,24,20,.68);
      line-height: 1.35;
    }

    .pool {
      align-content: start;
      gap: 20px;
      padding-block: 18px;
    }

    .pool-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .pool-title {
      display: grid;
      gap: 8px;
    }

    .pool-title h2 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(40px, 7vw, 84px);
      line-height: .95;
      letter-spacing: 0;
    }

    .pool-title p {
      margin: 0;
      max-width: 620px;
      font-size: 16px;
      line-height: 1.6;
      font-weight: 800;
      color: rgba(32,24,20,.72);
    }

    .pool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
    }

    .pool-card {
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: rgba(255,248,234,.72);
      box-shadow: 0 14px 34px rgba(63, 35, 16, .14);
    }

    .pool-card img {
      width: 100%;
      height: 100%;
      min-height: 260px;
      object-fit: cover;
      display: block;
      transition: transform .35s ease, filter .35s ease;
    }

    .pool-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 34%, rgba(32,24,20,.78));
      pointer-events: none;
    }

    .pool-info {
      position: absolute;
      inset: auto 0 0;
      z-index: 2;
      padding: 14px;
      color: var(--paper);
      display: grid;
      gap: 6px;
      transform: translateY(42px);
      transition: transform .28s ease;
    }

    .pool-info strong {
      font-family: Georgia, "Songti SC", serif;
      font-size: 24px;
      line-height: 1;
    }

    .pool-info span {
      width: fit-content;
      max-width: 100%;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,248,234,.2);
      border: 1px solid rgba(255,248,234,.35);
      font-size: 12px;
      font-weight: 900;
    }

    .pool-info p {
      margin: 0;
      opacity: 0;
      line-height: 1.45;
      font-size: 13px;
      font-weight: 800;
      transition: opacity .28s ease;
    }

    .pool-card:hover img,
    .pool-card:focus-within img {
      transform: scale(1.05);
      filter: saturate(1.08) contrast(1.05);
    }

    .pool-card:hover .pool-info,
    .pool-card:focus-within .pool-info {
      transform: translateY(0);
    }

    .pool-card:hover .pool-info p,
    .pool-card:focus-within .pool-info p {
      opacity: 1;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-16px) rotate(5deg); }
    }

    @keyframes crack {
      0% { transform: translate(0); filter: saturate(1); }
      25% { transform: translate(-8px, 4px) rotate(-1deg); filter: saturate(1.6) contrast(1.2); }
      50% { transform: translate(7px, -3px) rotate(1deg); }
      75% { transform: translate(-4px, -2px) rotate(-.4deg); }
      100% { transform: translate(0); }
    }

    @keyframes flash {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (max-width: 760px) {
      .app { padding: 14px; }
      .screen,
      .hero { min-height: calc(100vh - 28px); }
      .fruit-marquee { height: 150px; inset: 0 0 auto; }
      .question-top { grid-template-columns: 1fr; }
      .count { width: fit-content; }
      .option { grid-template-columns: 34px 1fr; min-height: 76px; }
      .letter { width: 34px; }
      .result-card { grid-template-columns: 1fr; }
      .portrait { min-height: 430px; }
      .catalog { grid-template-columns: repeat(2, 1fr); }
      .mini { min-height: 158px; }
      .pool-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .pool-card,
      .pool-card img { min-height: 220px; }
      .pool-info {
        transform: translateY(0);
        padding: 10px;
      }
      .pool-info p { opacity: 1; font-size: 12px; }
      .pool-info strong { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="screen hero active" id="home">
      <div class="fruit-marquee" aria-hidden="true">
        <div class="fruit">🍌</div>
        <div class="fruit">🍓</div>
        <div class="fruit">🍇</div>
        <div class="fruit">🍒</div>
        <div class="fruit">🫐</div>
      </div>
      <div class="eyebrow">AI Fruit Drama Personality Test</div>
      <h1>你是哪个<br>AI水果？</h1>
      <p class="lede">12 个选择，把你的处世准则、情感投射和内驱动力切成三瓣。测完看看你是柔软付出的前期主角，还是已经掌握剧情的后期大女主。</p>
      <div class="action-row">
        <button class="primary" id="startBtn">开始入戏</button>
        <button class="secondary" id="peekBtn">先看角色池</button>
      </div>
    </section>

    <section class="screen stage" id="quiz" aria-live="polite">
      <div class="panel">
        <div class="question-top">
          <h2 class="question" id="questionText"></h2>
          <div class="count" id="questionCount"></div>
          <div class="progress" style="--p: 0%"><span id="progressBar"></span></div>
        </div>
        <div class="options" id="options"></div>
        <div class="quiz-nav">
          <button class="arrow-btn" id="prevBtn" aria-label="上一题">←</button>
          <div class="nav-hint" id="navHint">选择一个答案后继续</div>
          <button class="arrow-btn" id="nextBtn" aria-label="下一题">→</button>
        </div>
      </div>
    </section>

    <section class="screen pool" id="pool">
      <div class="pool-head">
        <div class="pool-title">
          <div class="eyebrow">Character Pool</div>
          <h2>AI水果角色池</h2>
          <p>这里不是测试结果，只是先看全员图鉴。悬浮角色卡可以看到一句短评；正式匹配请回到测试里完成 12 道题。</p>
        </div>
        <div class="action-row">
          <button class="secondary" id="homeBtn">返回首页</button>
          <button class="primary" id="poolStartBtn">开始测试</button>
        </div>
      </div>
      <div class="pool-grid" id="poolGrid"></div>
    </section>

    <section class="screen result" id="result">
      <article class="result-card" id="resultCard">
        <aside class="portrait" id="portrait">
          <img class="role-photo" id="rolePhoto" alt="" />
          <div class="stamp" id="stamp"></div>
        </aside>
        <div class="result-main">
          <p class="role-id" id="roleId"></p>
          <h2 class="role-name" id="roleName"></h2>
          <p class="tagline" id="tagline"></p>
          <p class="analysis" id="analysis"></p>
          <div class="bars" id="bars"></div>
          <div class="quote" id="quote"></div>
          <div class="action-row">
            <button class="primary" id="restartBtn">重测一遍</button>
            <button class="primary blacken" id="blackenBtn">一键黑化</button>
          </div>
          <div class="catalog" id="catalog"></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const optionScores = { A: 1, B: 4, C: 7, D: 10 };

    const questions = [
      {
        id: 1,
        dimension: "ethics",
        text: "如果辛苦研发的成果被同事偷走并升职了，你会？",
        options: {
          A: "默默忍受，相信是金子总会发光",
          B: "向更高级别申诉，寻求正当公道",
          C: "表面恭喜，暗地搜集黑料等他最高光时拉他下马",
          D: "不计代价毁掉成果，让他身败名裂"
        }
      },
      {
        id: 2,
        dimension: "love",
        text: "当恋人身处低谷急需你所有积蓄支持，你会？",
        options: {
          A: "义无反顾，甚至去借钱帮他",
          B: "支持他，但会留一部分自己的底薪",
          C: "帮他分析，胜算不大就劝分",
          D: "迅速找好退路，绝不陪人吃苦"
        }
      },
      {
        id: 3,
        dimension: "drive",
        text: "你对理想职位的期待是？",
        options: {
          A: "温馨团队里的安稳小事",
          B: "稳定的中层管理或专家",
          C: "掌握话语权的高层领袖",
          D: "建立帝国，让所有人按我的规则走"
        }
      },
      {
        id: 4,
        dimension: "ethics",
        text: "为了达成人生跨越，你是否愿意牺牲一个无辜人的利益？",
        options: {
          A: "绝对不会，良心不安比失败更痛苦",
          B: "尽量避免，如有牺牲会事后补偿",
          C: "只要不违法，竞争中有人出局很正常",
          D: "挡路的人都是垫脚石"
        }
      },
      {

    const dimensionLabels = {
      ethics: ["处世准则", "至纯至善", "极致利己"],
      love: ["情感投射", "深情供养", "游戏人间"],
      drive: ["内驱动力", "淡泊随缘", "顶流之志"]
    };

    let current = 0;
    let answers = [];
    let answerLetters = [];
    let latestScores = { ethics: 1, love: 1, drive: 1 };

    const screens = {
      home: document.getElementById("home"),
      quiz: document.getElementById("quiz"),
      pool: document.getElementById("pool"),
      result: document.getElementById("result")
    };

    const show = (name) => {
      Object.values(screens).forEach((screen) => screen.classList.remove("active"));
      screens[name].classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    const renderQuestion = () => {
      const q = questions[current];
      const progress = ((current + 1) / questions.length) * 100;
      document.getElementById("questionText").textContent = q.text;
      document.getElementById("questionCount").textContent = `${current + 1} / ${questions.length}`;
      document.querySelector(".progress").style.setProperty("--p", `${progress}%`);
      document.getElementById("progressBar").style.width = `${progress}%`;

      const options = document.getElementById("options");
      options.innerHTML = "";
      Object.entries(q.options).forEach(([letter, text]) => {
        const button = document.createElement("button");
        button.className = `option${answerLetters[current] === letter ? " selected" : ""}`;
        button.innerHTML = `<span class="letter">${letter}</span><span>${text}</span>`;
        button.addEventListener("click", () => choose(letter));
        options.appendChild(button);
      });
      updateNav();
    };

    const choose = (letter) => {
      answers[current] = optionScores[letter];
      answerLetters[current] = letter;
      renderQuestion();
    };

    const updateNav = () => {
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navHint = document.getElementById("navHint");
      const hasAnswer = typeof answers[current] === "number";

      prevBtn.disabled = current === 0;
      nextBtn.disabled = !hasAnswer;
      nextBtn.textContent = current === questions.length - 1 ? "✓" : "→";
      nextBtn.setAttribute("aria-label", current === questions.length - 1 ? "查看结果" : "下一题");
      navHint.textContent = hasAnswer
        ? current === questions.length - 1 ? "答案已记录，点右侧查看结果" : "答案已记录，可继续或返回修改"
        : "选择一个答案后继续";
    };

    const goPrevious = () => {
      if (current > 0) {
        current -= 1;
        renderQuestion();
      }
    };

    const goNext = () => {
      if (typeof answers[current] !== "number") return;
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion();
      } else {
        document.querySelector(".progress").style.setProperty("--p", "100%");
        showResult();
      }
    };

    const average = (dimension) => {
      const values = questions
        .map((q, index) => ({ q, value: answers[index] }))
        .filter(({ q }) => q.dimension === dimension)
        .map(({ value }) => value);
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    };

    const getScores = () => ({
      ethics: average("ethics"),
      love: average("love"),
      drive: average("drive")
    });

    const distance = (scores, role) => {
      const point = [scores.ethics, scores.love, scores.drive];
      const weights = [1, 1.35, 1.05];
      let weighted = role.coords.reduce((sum, coord, index) => {
        return sum + weights[index] * Math.pow(coord - point[index], 2);
      }, 0);

      // High-risk/high-freedom archetypes should not match unless the user's
      // corresponding dimension is actually high enough.
      if (role.coords[1] >= 8 && scores.love < 6.5) {
        weighted += Math.pow(6.5 - scores.love, 2) * 2.4;
      }
      if (role.coords[1] >= 9 && scores.love < 7) {
        weighted += Math.pow(7 - scores.love, 2) * 2.2;
      }
      if (role.coords[0] >= 9 && scores.ethics < 6.5) {
        weighted += Math.pow(6.5 - scores.ethics, 2) * 2;
      }
      if (role.coords[2] >= 9 && scores.drive < 6) {
        weighted += Math.pow(6 - scores.drive, 2) * 1.4;
      }

      return Math.sqrt(weighted);
    };

    const matchRole = (scores) => roles
      .map((role) => ({ role, distance: distance(scores, role) }))
      .sort((a, b) => a.distance - b.distance)[0].role;

    const renderBars = (scores) => {
      const bars = document.getElementById("bars");
      bars.innerHTML = "";
      Object.entries(scores).forEach(([key, value]) => {
        const [label, low, high] = dimensionLabels[key];
        const row = document.createElement("div");
        row.innerHTML = `
          <div class="bar-head">
            <span>${label}：${low} ↔ ${high}</span>
            <span>${value.toFixed(1)}</span>
          </div>
          <div class="track"><div class="fill" style="--v:${value}"></div></div>
        `;
        bars.appendChild(row);
      });
    };

    const renderCatalog = () => {
      const catalog = document.getElementById("catalog");
      catalog.innerHTML = "";
      roles.forEach((role) => {
        const item = document.createElement("div");
        item.className = "mini";
        item.innerHTML = `
          <img src="${role.image}" alt="${role.name}">
          <strong>${role.name}</strong>
          <small>${role.keywords}</small>
        `;
        catalog.appendChild(item);
      });
    };

    const renderPool = () => {
      const poolGrid = document.getElementById("poolGrid");
      poolGrid.innerHTML = "";
      roles.forEach((role) => {
        const card = document.createElement("article");
        card.className = "pool-card";
        card.tabIndex = 0;
        card.innerHTML = `
          <img src="${role.image}" alt="${role.name}">
          <div class="pool-info">
            <strong>${role.name}</strong>
            <span>${role.keywords}</span>
            <p>${role.line}</p>
          </div>
        `;
        poolGrid.appendChild(card);
      });
    };

    const renderRole = (role, scores) => {
      document.getElementById("app").classList.remove("is-cracking");
      document.getElementById("portrait").style.setProperty("--role-bg", role.color);
      const photo = document.getElementById("rolePhoto");
      photo.src = role.image;
      photo.alt = role.name;
      document.getElementById("stamp").textContent = role.keywords;
      document.getElementById("roleId").textContent = role.id.toUpperCase();
      document.getElementById("roleName").textContent = role.name;
      document.getElementById("tagline").textContent = role.line;
      document.getElementById("analysis").textContent = role.analysis;
      document.getElementById("quote").textContent = role.quote;
      document.getElementById("blackenBtn").classList.toggle("visible", role.id === "banana_pre");
      renderBars(scores);
      renderCatalog();
    };

    const showResult = () => {
      latestScores = getScores();
      const role = matchRole(latestScores);
      renderRole(role, latestScores);
      show("result");
    };

    document.getElementById("startBtn").addEventListener("click", () => {
      current = 0;
      answers = [];
      answerLetters = [];
      renderQuestion();
      show("quiz");
    });

    document.getElementById("peekBtn").addEventListener("click", () => {
      renderPool();
      show("pool");
    });

    document.getElementById("homeBtn").addEventListener("click", () => {
      show("home");
    });

    document.getElementById("poolStartBtn").addEventListener("click", () => {
      current = 0;
      answers = [];
      answerLetters = [];
      renderQuestion();
      show("quiz");
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      current = 0;
      answers = [];
      answerLetters = [];
      renderQuestion();
      show("quiz");
    });

    document.getElementById("prevBtn").addEventListener("click", goPrevious);
    document.getElementById("nextBtn").addEventListener("click", goNext);

    document.getElementById("blackenBtn").addEventListener("click", () => {
      const app = document.getElementById("app");
      app.classList.add("is-cracking");
      setTimeout(() => {
        renderRole(roles.find((role) => role.id === "banana_post"), {
          ethics: 9,
          love: 7,
          drive: 10
        });
      }, 520);
